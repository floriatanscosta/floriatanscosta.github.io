# Configuração do Jekyll usada pelo GitHub Pages.
# As páginas são HTML estático gerado por _src/build.py; o Jekyll apenas as copia.

url: "https://floriatan.com.br"
baseurl: ""
title: "Floriatan Santos Costa"
description: "Pesquisador de Pós-Doutorado em Química Analítica"
author: "Floriatan Santos Costa"
lang: "pt-BR"
timezone: "Europe/Madrid"

# Pastas e arquivos iniciados por "_" ou "." (como _src/) já são ignorados pelo Jekyll.
exclude:
  - README.md
  - LICENSE
  - CHANGELOG.md
  - PENDENCIAS.md
  - design.md
  - .gitignore
  - node_modules/
  - package.json
  - package-lock.json
  - ".DS_Store"
  - "Thumbs.db"
