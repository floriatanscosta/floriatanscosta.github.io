<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -45 690 690" width="690" height="690" shape-rendering="geometricPrecision">
<!-- Versão animada de fundo.svg, usada só na abertura da página inicial.
     Anéis e selos giram em órbita, elétrons percorrem os anéis e as partículas flutuam.
     Tudo fica parado com prefers-reduced-motion. -->
<style>
.spin{transform-box:view-box;animation:spin linear infinite}
.o-lav{transform-origin:200.6px 255px;animation-duration:80s}
.o-blue{transform-origin:399.4px 334.5px;animation-duration:100s;animation-direction:reverse}
.keep-up{transform-origin:504px 487px;animation-duration:100s}
.e-lav-1{transform-origin:200.6px 255px;animation-duration:16s}
.e-lav-2{transform-origin:200.6px 255px;animation-duration:26s;animation-direction:reverse}
.e-blue-1{transform-origin:399.4px 334.5px;animation-duration:20s;animation-direction:reverse}
.e-blue-2{transform-origin:399.4px 334.5px;animation-duration:31s}
.float{transform-box:fill-box;transform-origin:center;animation:drift 14s ease-in-out infinite alternate}
.f2{animation-duration:11s;animation-delay:-4s}
.f3{animation-duration:17s;animation-delay:-9s}
.bob{animation:bob 6s ease-in-out infinite alternate}
.b2{animation-duration:7.5s;animation-delay:-3s}
.b3{animation-duration:5s;animation-delay:-1.5s}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 7s ease-in-out infinite}
.glow{animation:glow 9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(8px,-16px) rotate(90deg)}}
@keyframes bob{from{transform:translate(0,0)}to{transform:translate(0,-12px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.55}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
