<!-- components/header.html (PORTUGUÊS) -->
<header>
    <div class="container header-content">
        <a href="/">
            <img src="https://floriatan.com.br/assets/logo.svg" alt="Logo Floriatan" class="logo-img">
        </a>
        <h1 class="site-title">Floriatan Santos Costa</h1>
        
        <!-- Agrupando os botões na direita -->
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
            <!-- Botões de Idioma -->
            <div class="lang-dropdown">
                <button class="lang-dropbtn">PT</button>
                <div class="lang-dropdown-content">
                    <button onclick="switchLanguage('pt')">Português (PT)</button>
                    <button onclick="switchLanguage('en')">English (EN)</button>
                    <button onclick="switchLanguage('en')">Español (ES)</button>
                </div>
            </div>
            <!-- Botão de Tema (Modo Escuro) com SVG -->
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema" style="padding: 0;">
                <img src="https://floriatan.com.br/assets/icons/escuro.svg" alt="Ativar Modo Escuro" style="width: 20px; height: 20px;">
            </button>
            <!-- Botão Menu Mobile -->
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>
    </div>
</header>
<nav>
    <div class="container nav-content" id="navMenu">
        <a href="/">Início</a>
    </div>
</nav>

<link rel="stylesheet" href="https://floriatan.com.br/css/global.css">
<link rel="stylesheet" href="https://floriatan.com.br/css/main.css">
