<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Meta Tags -->
    <title>Experiência - Floriatan Santos Costa - Portfólio</title>
    <meta name="description" content="Portfólio acadêmico e profissional de Floriatan Santos Costa. Explore projetos, publicações e experiências.">
    <meta property="og:title" content="Floriatan Santos Costa - Portfólio">
    <meta property="og:description" content="Portfólio acadêmico e profissional. Explore projetos, publicações e experiências.">
    <meta property="og:image" content="./assets/img/cover.png">
    <meta name="theme-color" content="#5a729e">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://floriatan.com.br/">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0NDPRCLMYV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-0NDPRCLMYV');
    </script>
    
    <!-- Previne o piscar branco -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <!-- Cabeçalho e Navegação -->
    <header>
        <div class="container header-content">
            <a href="/">
                <img src="./assets/logo.svg" alt="Logo Floriatan" class="logo-img">
            </a>
            <h1 class="site-title">Floriatan Santos Costa</h1>
            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
                <div class="lang-dropdown">
                    <button class="lang-dropbtn">PT</button>
                    <div class="lang-dropdown-content">
                        <button onclick="switchLanguage('pt')">Português (PT)</button>
                        <button onclick="switchLanguage('en')">English (EN)</button>
                    </div>
                </div>
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Alternar Tema" style="padding: 0;"><img src="./assets/icons/escuro.svg" alt="Ativar Modo Escuro" style="width: 20px; height: 20px;"></button>
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            </div>
        </div>
    </header>
    <nav>
        <div class="container nav-content" id="navMenu">
            <a href="/">Início</a>
            <a href="/biografia">Biografia</a>
            <a href="/experiencia">Experiência</a>
            <a href="/publicacoes">Publicações</a>
            <a href="/premiacoes">Premiações</a>
            <a href="/contato">Contato</a>
        </div>
    </nav>

     <!-- CONTEÚDO EM ATUALIZAÇÃO -->
    <main>
        <div class="container">
            <section class="col-1" style="text-align: center; padding: 80px 20px;">
                <!-- Ícone de Manutenção/Atualização -->
                <img src="./assets/icons/erro.svg" alt="Em atualização"
                    style="width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.7;">
                <h1 class="intro-title" style="margin-bottom: 15px;">Página em Atualização</h1>
                <p class="intro-text" style="max-width: 600px; margin: 0 auto 40px;">
                    O conteúdo desta seção está sendo revisado e estará disponível em breve.
                </p>
                <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                    <a href="/" class="btn">Voltar ao Início</a>
                </div>
            </section>
        </div>
    </main>


    <!-- Rodapé -->
    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; <span id="year"></span> Floriatan Santos Costa — Todos os direitos reservados.</p>
            </div>
            <div class="footer-right">
                <a href="/sobre">Sobre</a>
                <a href="/contato">Contato</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./js/menu.js"></script>
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
